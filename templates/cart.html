{% extends "base.html" %}
{% block content %}
<div class="page-bg" style="background-image: url('{{ url_for('static', filename='images/cart-bg.png') }}');"></div>
<div class="container" style="max-width:600px;">
    <h1>🛍️ Your Cart</h1>

    {% if items %}
    <form method="POST" action="/cart/checkout" style="text-align:left;">
        {% for item in items %}
        <div class="history-item">
            <input type="checkbox" name="selected_items" value="{{ item.id }}" class="cart-checkbox" data-price="{{ item.price }}" onchange="updateTotal()" style="width:18px; height:18px;">
            <div style="flex-grow:1;">
                <p><strong>{{ item.name }}</strong></p>
                <p>₹{{ item.price }}</p>
            </div>
            <a href="/cart/remove/{{ item.id }}" style="color:#c0392b; font-size:13px; font-weight:600; text-decoration:none; white-space:nowrap;">✕ Remove</a>
        </div>
        {% endfor %}

        <h2 style="margin-top:20px;">Selected Total: ₹<span id="cartTotal">0</span></h2>

        <label class="small-text">Your Name</label>
        <input type="text" name="buyer_name" placeholder="Full name" required>

        <label class="small-text" style="display:block; margin-top:12px;">Phone Number</label>
        <input type="text" name="phone" placeholder="10-digit mobile number" required>

                <label class="small-text" style="display:block; margin-top:12px;">Flat / House No., Building Name</label>
        <input type="text" name="address_line1" placeholder="e.g. Flat 302, Green Residency" required>

        <label class="small-text" style="display:block; margin-top:12px;">Area / Street / Locality</label>
        <input type="text" name="address_line2" placeholder="e.g. MG Road, Andheri West" required>

        <label class="small-text" style="display:block; margin-top:12px;">Landmark (optional)</label>
        <input type="text" name="landmark" placeholder="e.g. Near City Hospital">

        <label class="small-text" style="display:block; margin-top:12px;">City</label>
        <input type="text" name="city" placeholder="e.g. Mumbai" required>

        <label class="small-text" style="display:block; margin-top:12px;">State</label>
        <input type="text" name="state" placeholder="e.g. Maharashtra" required>

        <label class="small-text" style="display:block; margin-top:12px;">Pincode</label>
        <input type="text" name="pincode" placeholder="e.g. 400058" required>

        <div style="text-align:center;">
            <button type="submit" class="btn">Checkout Selected Items</button>
        </div>
    </form>
    <div style="text-align:center;">
        <a href="/store" class="btn-outline" style="display:inline-block; margin-top:14px; max-width:200px;">Continue Shopping</a>
    </div>
    {% else %}
        <p>Your cart is empty.</p>
        <a href="/store" class="btn">Browse Plants</a>
    {% endif %}
</div>

<script>
function updateTotal() {
    let total = 0;
    document.querySelectorAll(".cart-checkbox:checked").forEach(cb => {
        total += parseFloat(cb.dataset.price);
    });
    document.getElementById("cartTotal").textContent = total;
}
</script>
{% endblock %}
