{% extends "base.html" %}
{% block content %}
<div class="page-bg" style="background-image: url('{{ bg_image }}');"></div>
<div class="container">
    <h1>🌿 Upload Plant Photo</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="plant_image" accept="image/*" required><br><br>
        <button type="submit" class="btn">Analyze Plant</button>
    </form>
    <p>{{ message }}</p>
</div>
{% endblock %}
